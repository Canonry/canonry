name: Refresh crawler IP ranges

# Publisher manifests are checked weekly, but the refresher preserves the
# vendored file when the executable prefix set is unchanged. This workflow
# therefore opens or updates one reviewable PR only for a real range/source
# change, rather than creating weekly metadata churn.
on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-crawler-ip-ranges
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Refresh and validate every publisher manifest
        run: pnpm --filter @ainyc/canonry-integration-traffic run refresh-ip-ranges

      - name: Check for executable range changes
        id: changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- packages/integration-traffic/src/ip-ranges)" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      # A range snapshot changes shipped classification behavior and commonly
      # exceeds the repository's 100-line version threshold. Keep the runtime
      # package and native-plugin discovery manifests in lockstep automatically.
      - name: Bump Canonry patch version
        if: steps.changes.outputs.changed == 'true'
        id: version
        shell: bash
        run: |
          current="$(node -p "require('./package.json').version")"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected an exact Canonry semver, received: $current" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          npm pkg set "version=$next"
          npm pkg set "version=$next" --prefix packages/canonry
          # `verifyDepsBeforeRun: error` (pnpm-workspace.yaml) checks every
          # workspace manifest's name+version against the name+version recorded
          # in node_modules/.pnpm-workspace-state-v1.json at install time. The
          # two `npm pkg set` calls above make that snapshot stale, so the very
          # next `pnpm <script>` — plugin:sync here, then verify and build —
          # dies with ERR_PNPM_VERIFY_DEPS_BEFORE_RUN. Nothing is actually out
          # of sync: a workspace version bump cannot move the lockfile, which
          # records workspace links as `link:` targets, so `--frozen-lockfile`
          # is a no-op resolution that only rewrites the state file. Keep this
          # between the bump and the first pnpm script, matching the
          # bump → install → gates order in bump-aeo-audit.yml.
          pnpm install --frozen-lockfile
          pnpm plugin:sync
          echo "from=$current" >> "$GITHUB_OUTPUT"
          echo "to=$next" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN-created PRs do not trigger ci.yml. Run every repository
      # gate here so either token path has equivalent pre-PR coverage.
      - name: Verify repository
        if: steps.changes.outputs.changed == 'true'
        run: pnpm run verify

      - name: Build repository
        if: steps.changes.outputs.changed == 'true'
        run: pnpm -r run build

      - name: Open or update refresh pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        env:
          # The action restores main before pushing the refresh branch, so the
          # local pre-push hook sees a different tree. The gates above already
          # validated the refresh; skip hooks only for this action.
          HUSKY: '0'
        with:
          # Reuse the existing automation PAT until the org-wide token name is
          # available. GITHUB_TOKEN remains a fallback for forks.
          token: ${{ secrets.CANONRY_AUTOMATION_PR_TOKEN || secrets.AEO_AUDIT_BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          base: main
          branch: chore/refresh-crawler-ip-ranges
          delete-branch: true
          add-paths: |
            package.json
            packages/canonry/package.json
            packages/integration-traffic/src/ip-ranges/*.json
            plugins/canonry/plugin.json
            plugins/canonry/.codex-plugin/plugin.json
            plugins/canonry/.claude-plugin/plugin.json
          commit-message: 'chore(traffic): refresh crawler IP ranges'
          title: 'chore(traffic): refresh crawler IP ranges (v${{ steps.version.outputs.to }})'
          labels: dependencies
          body: |
            Automated refresh of Canonry's vendored publisher IP-range manifests.

            - All configured publisher responses passed strict manifest validation.
            - Metadata-only and prefix-order changes are suppressed by canonical content hashing.
            - Canonry was patch-bumped `${{ steps.version.outputs.from }}` → `${{ steps.version.outputs.to }}` per repository version policy.
            - Full generation, plugin, typecheck, lint, test, and build gates passed before this PR opened.
            - Runtime classification still uses reviewed, deterministic snapshots and performs no network I/O.

            Generated by `.github/workflows/refresh-crawler-ip-ranges.yml`.
