name: Bump aeo-audit

# Keeps the local runtime's pinned @canonry/aeo-audit engine current. The cloud
# worker remains pinned to @ainyc/aeo-audit@4.2.0. aeo-audit ships often, so
# this checks npm on a schedule, bumps the exact pin, and — only if the bump
# survives typecheck, lint, build, and the full test suite — opens a PR.
#
# Why the gates run IN this job rather than only on the PR: aeo-audit is an
# EXTERNAL runtime dependency, not a bundled one. tsup externalizes everything
# in `dependencies`, and aeo-audit is not in `noExternal`, so the pinned version
# is what `npm i -g @canonry/canonry` resolves and installs on a user's machine.
# The pin is therefore a supply-chain decision, and a breaking aeo-audit release
# must fail here and never produce a green PR.
#
# Run it on demand from the Actions tab via "Run workflow".
#
# NOTE: the final "Open pull request" step needs AEO_AUDIT_BUMP_TOKEN. The
# GITHUB_TOKEN fallback cannot open a PR while the Canonry org disallows
# "Allow GitHub Actions to create and approve pull requests" — the job runs
# every gate green and then dies on the last step, leaving a bump on the branch
# with no PR behind it. That silently froze the pin at 4.0.1 from 2026-06-22
# until #950 landed 4.2.0 by hand.

on:
  schedule:
    # Mondays 09:00 UTC. Tighten the cron if you ship aeo-audit more often.
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Target @canonry/aeo-audit version (blank = npm latest dist-tag)'
        required: false
        default: ''
      bump_canonry_version:
        description: 'Also patch @canonry/canonry version (default off: engine updates in-repo, ships with the next canonry release)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

# Never let two bump runs race to open competing PRs / branches.
concurrency:
  group: bump-aeo-audit
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Resolve target + rewrite exact engine pins
        id: bump
        shell: bash
        env:
          AEO_AUDIT_VERSION: ${{ github.event.inputs.version }}
          # Empty on the schedule, "false" by default on dispatch -> no canonry
          # version bump. Toggle the input on (passes "true") to opt in.
          BUMP_CANONRY_VERSION: ${{ github.event.inputs.bump_canonry_version }}
        run: node scripts/bump-aeo-audit.mjs

      - name: Update lockfile + install
        if: steps.bump.outputs.changed == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck (gate the bump)
        if: steps.bump.outputs.changed == 'true'
        run: pnpm run typecheck

      - name: Lint (gate the bump)
        if: steps.bump.outputs.changed == 'true'
        run: pnpm run lint

      # Build all packages recursively (matches ci.yml's build job) — a bump that
      # typechecks can still break the SPA build or the asset copy. aeo-audit
      # itself is external (see the header), so a breaking engine change surfaces
      # in typecheck and the test suite, not here. Runs before the long test suite
      # to fail fast.
      - name: Build (gate the bump)
        if: steps.bump.outputs.changed == 'true'
        run: pnpm -r run build

      - name: Test (gate the bump)
        if: steps.bump.outputs.changed == 'true'
        run: pnpm run test

      - name: Open pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # Prefer a configured PAT/app token so the PR triggers the CI workflow;
          # fall back to GITHUB_TOKEN (PR still opens, but the default token does
          # not re-trigger `ci.yml` — this job's own typecheck/lint/build/test are the gate).
          token: ${{ secrets.AEO_AUDIT_BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          base: main
          branch: chore/bump-aeo-audit
          delete-branch: true
          commit-message: 'chore(deps): bump @canonry/aeo-audit to ${{ steps.bump.outputs.to }}'
          title: 'chore(deps): bump @canonry/aeo-audit to ${{ steps.bump.outputs.to }}'
          labels: dependencies
          body: |
            Automated bump of **`@canonry/aeo-audit`** `${{ steps.bump.outputs.from }}` → `${{ steps.bump.outputs.to }}` for the local Canonry runtime.

            - ${{ steps.bump.outputs.version_note }}
            - `apps/worker` intentionally remains pinned to `@ainyc/aeo-audit@4.2.0`.
            - This job already ran the workspace gates (typecheck, lint, build, test) against the bump — all passed.
            - The Val Town sample under `apps/vals/` is not gated here; re-lock and check it by hand before its next manual deploy.

            Review the aeo-audit changelog for behavioral changes, then merge. Generated by `.github/workflows/bump-aeo-audit.yml`.
