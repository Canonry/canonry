name: Check better-sqlite3 prebuilds

# Check the published npm tarball for SQLite 13's ABI-stable platform binaries.
# A missing platform fails visibly without requiring permission to open a PR.

on:
  schedule:
    # Mondays 10:00 UTC, an hour after bump-aeo-audit so the two do not collide.
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-better-sqlite3-prebuilds
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1

      # Inspect the published tarball without installing or executing it.
      - name: Check published Node-API binaries
        run: node scripts/check-better-sqlite3-prebuilds.mjs
