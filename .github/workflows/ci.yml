name: CI

on:
  push:
    branches: [main]
    paths:
      # Every workflow, not just this one: a change to a deploy workflow is a
      # change to how something reaches production, and it went unvalidated
      # while only `ci.yml` was listed.
      - '.github/workflows/**'
      - '.github/actions/setup/action.yml'
      - '.husky/**'
      - '.dockerignore'
      - 'Dockerfile'
      - 'docker/**'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - 'scripts/**'
      # Workspace-level guards live here and belong to no single package.
      # Without this, a PR that changes only a guard never runs it.
      - 'test/**'
      - 'test-setup/**'
      - 'vitest.config.ts'
      - 'skills/**'
      - 'plugins/**'
      - '.agents/**'
      - '.claude-plugin/**'
      - 'docs/CODEMAP.md'
      - 'docs/GUARDS.md'
      - 'docs/DOC_UPDATE.md'
      - 'docs/agent-operations/**'
      - 'AGENTS.md'
  pull_request:
    # No `branches:` filter — run CI on every PR, including stacked PRs
    # targeting feature branches. This keeps each step of a stack green
    # without waiting until rebase-to-main.
    paths:
      # Every workflow, not just this one: a change to a deploy workflow is a
      # change to how something reaches production, and it went unvalidated
      # while only `ci.yml` was listed.
      - '.github/workflows/**'
      - '.github/actions/setup/action.yml'
      - '.husky/**'
      - '.dockerignore'
      - 'Dockerfile'
      - 'docker/**'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - 'scripts/**'
      # Workspace-level guards live here and belong to no single package.
      # Without this, a PR that changes only a guard never runs it.
      - 'test/**'
      - 'test-setup/**'
      - 'vitest.config.ts'
      - 'skills/**'
      - 'plugins/**'
      - '.agents/**'
      - '.claude-plugin/**'
      - 'docs/CODEMAP.md'
      - 'docs/GUARDS.md'
      - 'docs/DOC_UPDATE.md'
      - 'docs/agent-operations/**'
      - 'AGENTS.md'

# New PR commits replace obsolete validation. Keep main runs for release evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Restore TypeScript incremental cache
        uses: actions/cache@v4
        with:
          # Cache one archive: a recursive glob walks node_modules during save
          # and has cost over a minute for less than 1 MB of compiler state.
          path: .tmp/ci/tsbuildinfo.tar
          key: tsbuildinfo-v2-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            tsbuildinfo-v2-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Unpack TypeScript incremental state
        run: |
          if [ -f .tmp/ci/tsbuildinfo.tar ]; then
            tar -xf .tmp/ci/tsbuildinfo.tar
          fi
      - run: pnpm run typecheck
      - name: Collect TypeScript incremental state
        shell: bash
        run: |
          mkdir -p .tmp/ci
          shopt -s nullglob
          files=(packages/*/*.tsbuildinfo apps/*/*.tsbuildinfo scripts/*.tsbuildinfo test/*.tsbuildinfo)
          tar -cf .tmp/ci/tsbuildinfo.tar --files-from /dev/null "${files[@]}"

  test_shards:
    name: test ${{ matrix.shard }} (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Both majors run the whole suite across four shards. Two Node 26 shards
      # left an 8+ minute tail even while the four Node 22 shards finished.
      # Node 22 is the deployment major; Node 26 is the highest supported major
      # in scripts/check-node.mjs. Keep full coverage on both.
      #
      # The pairing is the point: better-sqlite3 is a NATIVE module, so a major
      # is only "supported" if its prebuilt binary resolves and loads.
      # `node-support-range.test.ts` asserts this matrix covers the highest
      # supported major, so the claim cannot drift from its evidence the way it
      # did while the guard sat at 25 for months.
      matrix:
        include:
          - { node: '22', shard: '1/4' }
          - { node: '22', shard: '2/4' }
          - { node: '22', shard: '3/4' }
          - { node: '22', shard: '4/4' }
          - { node: '26', shard: '1/4' }
          - { node: '26', shard: '2/4' }
          - { node: '26', shard: '3/4' }
          - { node: '26', shard: '4/4' }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Fingerprint test compilation context
        id: test-cache-key
        shell: bash
        run: |
          # File additions/removals can change import resolution. Config and
          # manifest contents also affect transforms of unchanged source files.
          # Git reads the checkout index, without traversing node_modules.
          fingerprint=$({
            git ls-files -z
            git ls-files --stage -z -- '*config*' '*lock*' 'package.json' '**/package.json' 'pnpm-workspace.yaml' '.github'
          } | sha256sum)
          echo "value=${fingerprint%% *}" >> "$GITHUB_OUTPUT"
      - name: Restore test compilation caches
        uses: actions/cache@v4
        with:
          path: .tmp/ci/test-compilation
          key: test-compilation-v1-${{ runner.os }}-${{ runner.arch }}-node${{ matrix.node }}-${{ matrix.shard }}-${{ steps.test-cache-key.outputs.value }}-${{ github.run_id }}
          restore-keys: |
            test-compilation-v1-${{ runner.os }}-${{ runner.arch }}-node${{ matrix.node }}-${{ matrix.shard }}-${{ steps.test-cache-key.outputs.value }}-
      # Reuse compiled modules only. Vitest still executes every test, and
      # invalidates transforms when their source content changes.
      - run: pnpm run test --shard=${{ matrix.shard }} --experimental.fsModuleCache --experimental.fsModuleCachePath=.tmp/ci/test-compilation/vitest
        env:
          NODE_COMPILE_CACHE: ${{ github.workspace }}/.tmp/ci/test-compilation/node

  test:
    name: test
    needs: test_shards
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify all test shards succeeded
        env:
          SHARD_RESULT: ${{ needs.test_shards.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "One or more test shards failed"
            exit 1
          fi
          echo "All test shards passed"

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bash scripts/check-docs.sh
        name: Check documentation coverage (AGENTS.md per package)
      - run: pnpm run lint

  # The WP plugin's PHP suite. It runs here and ONLY here: the root test
  # script is vitest-only, and wp-plugin-release.yml auto-publishes the plugin
  # zip on any merge that touches the plugin — so without this job a broken
  # plugin change would ship to client sites untested. ubuntu-latest bundles
  # PHP, and the suite is a dependency-free custom runner (no composer).
  wp-plugin-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: php --version
      - run: php test/run-tests.php
        working-directory: packages/wordpress-traffic-logger-plugin
        name: WordPress traffic-logger plugin suite

  ts-prune:
    # Lightweight dead-export check via npx (no heavy dep in repo). Reports unused exports not used outside their module; filtered to exclude "used in module" noise. Non-blocking — surfaces in logs without failing CI.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx --yes ts-prune -p tsconfig.base.json -s ".*\\.test\\.ts" 2>&1 | tee /tmp/ts-prune.txt; echo "--- ts-prune (filtered) ---"; grep -v "used in module" /tmp/ts-prune.txt | head -n 50 || true
        name: Report unused exports (ts-prune, no heavy dep)

  codegen-drift:
    # Regenerates the hey-api client from the OpenAPI spec and fails if the
    # committed output differs. Run separately from `lint` so a stale client
    # surfaces as its own check name and a contributor knows to run
    # `pnpm --filter @ainyc/canonry-api-client gen` locally.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @ainyc/canonry-api-client gen:check
        name: Verify generated API client matches OpenAPI spec

  plugin-drift:
    # The native plugin mirrors the canonical Canonry/Aero skills and package
    # version, and CODEMAP.md indexes key files. Fail with a focused check when a generated copy is stale, CODEMAP is stale, or a plugin-affecting change reuses the version already present on the base.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The version-advancement gate resolves the PR/push merge base.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Verify native plugin assets are in sync
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASE_REF="$EVENT_BASE_SHA"
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF=$(git rev-parse HEAD^)
          fi
          if ! git cat-file -e "$BASE_REF^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
          fi
          pnpm plugin:check --base-ref "$BASE_REF"

      # The Val Town mirror is generated from `skills/`, so a skill edit that
      # skips the sync ships a Val serving stale playbooks. Nothing else catches
      # it: the generated modules compile and the Deno suite passes either way.
      - name: Verify the Val Town skill mirror is in sync
        run: pnpm val:skills:check

  version-guard:
    # Catches the release hazard CI is otherwise structurally blind to.
    #
    # `plugin:check --base-ref` already asserts the version advanced past the
    # MERGE BASE, i.e. past where the branch started. It cannot see main moving
    # underneath a long-lived PR. When it does, the branch still "advanced" and
    # the check passes, but after merge `publish.yml` compares HEAD against its
    # parent, finds the version unchanged, and SKIPS npm + Homebrew while Docker
    # still moves `latest`. A silent half-release, twice observed.
    #
    # So compare against the BASE BRANCH TIP, which is what the version will be
    # measured against after the merge lands.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version must still be releasable against the base branch tip
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"

          version_at() {
            git show "$1":packages/canonry/package.json 2>/dev/null \
              | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{try{console.log(JSON.parse(s).version??'')}catch{console.log('')}})"
          }

          MERGE_BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          HEAD_V=$(node -p "require('./packages/canonry/package.json').version")
          BASE_V=$(version_at "$MERGE_BASE")
          TIP_V=$(version_at "origin/$BASE_REF")

          echo "branch point: $BASE_V | base tip: $TIP_V | this PR: $HEAD_V"

          # No bump attempted. Legitimate for docs and small changes, and the
          # repo's versioning rule allows it, so nothing to check.
          if [ "$HEAD_V" = "$BASE_V" ]; then
            echo "No version bump in this PR — nothing to verify."
            exit 0
          fi

          # A bump WAS attempted. It has to still be a bump once merged.
          if [ "$(printf '%s\n%s\n' "$TIP_V" "$HEAD_V" | sort -V | tail -1)" != "$HEAD_V" ] || [ "$HEAD_V" = "$TIP_V" ]; then
            echo "::error::This PR bumps $BASE_V -> $HEAD_V, but $BASE_REF is already at $TIP_V."
            echo "::error::Merging would leave the version unchanged, so publish.yml would skip npm and Homebrew while Docker still moves 'latest'."
            echo "::error::Rebase onto $BASE_REF and bump past $TIP_V."
            exit 1
          fi

          # And it has to be a version nobody has taken.
          if npm view "@canonry/canonry@$HEAD_V" version >/dev/null 2>&1; then
            echo "::error::@canonry/canonry@$HEAD_V is already published to npm. Pick the next unused version."
            exit 1
          fi

          echo "OK: $HEAD_V is ahead of the base tip ($TIP_V) and unpublished."

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm -r run build
        name: Build all packages (catches missing deps, bundler errors)
      - name: Pack built Canonry for the install smoke test
        working-directory: packages/canonry
        run: pnpm pack --pack-destination "$RUNNER_TEMP/canonry-package"
      - uses: actions/upload-artifact@v4
        with:
          name: canonry-package
          path: ${{ runner.temp }}/canonry-package/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish-smoke-test:
    # Catches the failure mode where a workspace dep leaks into runtime
    # `dependencies` (pnpm publish rewrites `workspace:*` → `0.0.0`,
    # which 404s on `npm install` because private workspace packages
    # aren't published). Packs canonry the same way the publish workflow
    # does and runs `npm install` against the build job's tarball from a scratch
    # directory — exactly what external users do when they `npm i -g`.
    # No checkout or workspace dependencies: reuse the completed build while
    # keeping the install independent of workspace resolution.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: canonry-package
          path: ${{ runner.temp }}/canonry-package
      - name: Install canonry from tarball into scratch project
        shell: bash
        run: |
          shopt -s nullglob
          tarballs=("$RUNNER_TEMP"/canonry-package/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one Canonry package tarball" >&2
            exit 1
          fi
          SCRATCH=$(mktemp -d)
          cd "$SCRATCH"
          npm init -y > /dev/null
          npm install "${tarballs[0]}"
          ./node_modules/.bin/canonry --version

  validate:
    runs-on: ubuntu-latest
    needs: [typecheck, test, lint, codegen-drift, plugin-drift, build, publish-smoke-test, wp-plugin-tests]
    if: always()
    steps:
      - name: Verify all validate jobs succeeded
        run: |
          if [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.codegen-drift.result }}" != "success" ] || \
             [ "${{ needs.plugin-drift.result }}" != "success" ] || \
             [ "${{ needs.wp-plugin-tests.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.publish-smoke-test.result }}" != "success" ]; then
            echo "One or more validate jobs failed"
            exit 1
          fi
          echo "All validate jobs passed"

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Use the runner's bundled buildx/docker driver so CI doesn't have to pull
      # an extra BuildKit image from Docker Hub before the actual image build.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: canonry:ci

      - name: Smoke test container
        shell: bash
        run: |
          # The container does not inherit the runner's CI=true, so telemetry must
          # be disabled explicitly: every run is a fresh install ID that otherwise
          # reports `serve.started` and `cli.command` as a real user.
          docker run -d --rm --name canonry-ci -p 4100:4100 -e CANONRY_API_KEY=test -e CANONRY_TELEMETRY_DISABLED=1 canonry:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4100/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs canonry-ci
          exit 1

      - name: Cleanup smoke container
        if: always()
        run: docker rm -f canonry-ci || true
