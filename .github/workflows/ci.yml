name: CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/setup/action.yml'
      - '.dockerignore'
      - 'Dockerfile*'
      - 'docker/**'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - '.npmrc'
      - '.nvmrc'
      - 'Makefile'
      - 'scripts/**'
      - 'skills/**'
      - 'plugins/**'
      - '.agents/**'
      - '.claude-plugin/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
  pull_request:
    # No `branches:` filter — run CI on every PR, including stacked PRs
    # targeting feature branches. This keeps each step of a stack green
    # without waiting until rebase-to-main.
    paths:
      - '.github/workflows/**'
      - '.github/actions/setup/action.yml'
      - '.dockerignore'
      - 'Dockerfile*'
      - 'docker/**'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - 'eslint.config.js'
      - '.npmrc'
      - '.nvmrc'
      - 'Makefile'
      - 'scripts/**'
      - 'skills/**'
      - 'plugins/**'
      - '.agents/**'
      - '.claude-plugin/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'README.md'
  workflow_dispatch:
    inputs:
      publish_docker:
        description: Publish Docker images after the full validation suite passes
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Restore TypeScript incremental cache
        uses: actions/cache@v4
        with:
          path: '**/*.tsbuildinfo'
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            tsbuildinfo-${{ runner.os }}-
      - run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # GitHub-hosted runners expose one vCPU. Keep the full suite on one
      # runner and disable worker, file-level, and in-file parallelism.
      - run: pnpm run test:ci

  wordpress-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: none
          coverage: none
      - name: Validate WordPress plugin on PHP 7.4
        run: bash scripts/check-wordpress-plugin.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          coverage: none
      - name: Validate WordPress plugin on PHP 8.3
        run: bash scripts/check-wordpress-plugin.sh

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run docs:check
        name: Check documentation coverage (AGENTS.md per package)
      - run: pnpm run lint

  codegen-drift:
    # Regenerates the hey-api client from the OpenAPI spec and fails if the
    # committed output differs. Run separately from `lint` so a stale client
    # surfaces as its own check name and a contributor knows to run
    # `pnpm --filter @ainyc/canonry-api-client gen` locally.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @ainyc/canonry-api-client gen:check
        name: Verify generated API client matches OpenAPI spec

  plugin-drift:
    # The native plugin mirrors the canonical Canonry/Aero skills and package
    # version. Fail with a focused check when a generated copy is stale or a
    # plugin-affecting change reuses the version already present on the base.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The version-advancement gate resolves the PR/push merge base.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Verify native plugin assets are in sync
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          BASE_REF="$EVENT_BASE_SHA"
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF=$(git rev-parse HEAD^)
          fi
          if ! git cat-file -e "$BASE_REF^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
          fi
          pnpm plugin:check --base-ref "$BASE_REF"

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm -r run build
        name: Build all packages (catches missing deps, bundler errors)

  publish-smoke-test:
    # Catches the failure mode where a workspace dep leaks into runtime
    # `dependencies` (pnpm publish rewrites `workspace:*` → `0.0.0`,
    # which 404s on `npm install` because private workspace packages
    # aren't published). Packs canonry the same way the publish workflow
    # does and runs `npm install` against the tarball from a scratch
    # directory — exactly what external users do when they `npm i -g`.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm run package:smoke

  validate:
    runs-on: ubuntu-latest
    needs: [typecheck, test, wordpress-plugin, lint, codegen-drift, plugin-drift, build, publish-smoke-test, docker-build]
    if: always()
    steps:
      - name: Verify all validate jobs succeeded
        run: |
          if [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.wordpress-plugin.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.codegen-drift.result }}" != "success" ] || \
             [ "${{ needs.plugin-drift.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.publish-smoke-test.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "One or more validate jobs failed"
            exit 1
          fi
          echo "All validate jobs passed"

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test container
        run: bash scripts/docker-smoke.sh

  release:
    needs: [validate]
    if: >-
      needs.validate.result == 'success' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_docker))
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    secrets: inherit
