name: Setup canonry
description: Install pnpm, Node, and project dependencies. Assumes the repo is already checked out.
inputs:
  node-version:
    description: >
      Node version to install. Defaults to the patched version in .nvmrc and
      Docker. CI also exercises the older supported release lines.
    required: false
    default: '26.12.1'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 12.14.0
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
