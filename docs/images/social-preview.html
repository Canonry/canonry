<!doctype html>
<!--
  Canonry's GitHub social preview (1280×640). From the repo root, render it to social-preview.png:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1280,640 --virtual-time-budget=15000 \
      --screenshot="$PWD/docs/images/social-preview.png" "file://$PWD/docs/images/social-preview.html"

  Fonts load from Google Fonts, so rendering needs network access. Upload the PNG on GitHub under
  Settings > General > Social preview. Every figure comes from the live demo's stored data (see the
  comments on each chart); keep it that way if you change one. Mention figures use non-brand queries only.
-->

  :root {
    --bg: #ffffff; --fg: #171717; --fg-2: #5c5c5c; --fg-3: #8a8a8a;
    --grid: rgb(0 0 0 / 0.07); --axis: rgb(0 0 0 / 0.3); --rule: #e6e6e6;
    --claude: #ea580c; --gemini: #2563eb; --openai: #059669;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body { background: var(--bg); color: var(--fg); font-family: 'Geist', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  .card { position: relative; width: 1280px; height: 640px; overflow: hidden; }
  .head { position: absolute; left: 64px; right: 64px; top: 40px; }
  .lockup { display: flex; align-items: center; gap: 12px; }
  .lockup img { width: 36px; height: 36px; display: block; }
  .lockup span { font-size: 24px; font-weight: 600; letter-spacing: -0.025em; }
  h1 { margin-top: 20px; font-size: 46px; line-height: 1.05; font-weight: 650; letter-spacing: -0.042em; }
  svg { position: absolute; inset: 0; }
  svg text { font-family: 'Geist', sans-serif; }
  svg .mono { font-family: 'Geist Mono', monospace; font-variant-numeric: tabular-nums; }
</style>
</head>
