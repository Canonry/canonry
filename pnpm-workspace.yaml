packages:
  - apps/*
  - packages/*

# Refuse to run a script against a node_modules that no longer matches the
# lockfile, rather than letting the run fail somewhere confusing later.
#
# The failure this prevents, hit twice in one afternoon: a commit adds a
# workspace dependency (`@canonry/canonry-contracts` to integration-bing), someone
# pulls or rebases onto it without installing, and the whole api-routes suite
# dies at import with `Cannot find package '@canonry/canonry-contracts' imported
# from packages/integration-bing/src/bing-client.ts`. That reads as a broken
# import in a package nobody touched, and the actual remedy — `pnpm install` —
# appears nowhere in the message.
#
# `error` is the only mode that fits. `install` would mutate node_modules
# mid-command, papering over the lockfile problem `--frozen-lockfile` exists to
# catch; `prompt` blocks on stdin and would hang any non-interactive runner. The
# value must be the string `error`: `true` parses fine, matches no branch, and
# is a silent no-op.
#
# Costs a few hundredths of a second when in sync — the check short-circuits on
# manifest mtimes and only reads the lockfile when one is newer than the last
# install. It never blocks `pnpm install` itself, so the remedy it names always
# works.
#
# One CI caveat, learned the hard way: the recorded state includes every
# workspace project's name AND version, so a job that REWRITES a manifest after
# .github/actions/setup has installed — `npm pkg set version=…` in
# refresh-crawler-ip-ranges.yml — invalidates the snapshot even though nothing
# about the dependency graph moved, and every later `pnpm <script>` in that job
# dies. Re-run `pnpm install --frozen-lockfile` between the rewrite and the next
# pnpm script; it is a no-op resolution that just refreshes the state file.
verifyDepsBeforeRun: error

overrides:
  "@esbuild-kit/core-utils>esbuild": ^0.28.1
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2

allowBuilds:
  esbuild: true
  "@google/genai": false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@0.137.0'
  - '@duckdb/node-api@1.5.6-r.2'
  - '@duckdb/node-bindings-darwin-arm64@1.5.6-r.2'
  - '@duckdb/node-bindings-darwin-x64@1.5.6-r.2'
  - '@duckdb/node-bindings-linux-arm64-musl@1.5.6-r.2'
  - '@duckdb/node-bindings-linux-arm64@1.5.6-r.2'
  - '@duckdb/node-bindings-linux-x64-musl@1.5.6-r.2'
  - '@duckdb/node-bindings-linux-x64@1.5.6-r.2'
  - '@duckdb/node-bindings-win32-arm64@1.5.6-r.2'
  - '@duckdb/node-bindings-win32-x64@1.5.6-r.2'
  - '@duckdb/node-bindings@1.5.6-r.2'
  - lucide-react@1.61.0
  - openai@7.40.0
  - vite@8.3.5
  - '@canonry/aeo-audit@7.5.0'
